name: QA Automation

on:
  push:
    branches:
      - test

  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:

  test:

    runs-on: ubuntu-latest

    env:
      BASE_URL: ${{ vars.BASE_URL }}
      CHAINEX_PASSWORD: ${{ secrets.CHAINEX_PASSWORD }}

    steps:

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get Allure History
        run: |
          rm -rf previous-history
          mkdir -p previous-history

          git fetch origin allure-history:refs/remotes/origin/allure-history

          git archive origin/allure-history history 2>/dev/null | tar -x -C previous-history || true

          if [ -d "previous-history/history" ]; then
            echo "Previous Allure history found."
            ls -la previous-history/history
          else
            echo "No previous Allure history found. This may be the first run."
          fi  

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Environment Check
        run: |
          echo "===== Environment ====="
          echo "Node: $(node --version)"
          echo "NPM: $(npm --version)"
          echo "BASE_URL configured: ${BASE_URL:+YES}"
          echo "CHAINEX_PASSWORD configured: ${CHAINEX_PASSWORD:+YES}"

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install chromium

      - name: Prepare Allure Environment
        run: |
          mkdir -p allure-results

          echo "Environment=Staging" > allure-results/environment.properties
          echo "Browser=Chromium" >> allure-results/environment.properties
          echo "Automation=Playwright" >> allure-results/environment.properties
          echo "Framework=Cucumber" >> allure-results/environment.properties
          echo "Node=$(node --version)" >> allure-results/environment.properties
          echo "NPM=$(npm --version)" >> allure-results/environment.properties
          echo "BaseURL=${BASE_URL}" >> allure-results/environment.properties  

      - name: Run tests
        run: npm test

      - name: Restore Allure History
        if: always()
        run: |
          if [ -d "previous-history/history" ]; then
            echo "Restoring previous Allure history..."
            mkdir -p allure-results/history
            cp -R previous-history/history/. allure-results/history/
            echo "Allure history restored:"
            ls -la allure-results/history
          else
            echo "No previous history available."
          fi

      - name: Generate Allure Report
        if: always()
        run: npm run allure:generate

      - name: Save Allure History
        if: always()
        run: |
          rm -rf history-to-save
          mkdir -p history-to-save

          if [ -d "allure-report/history" ]; then
            cp -R allure-report/history history-to-save/
            echo "New Allure history prepared."
            ls -la history-to-save/history
          else
            echo "Allure history directory not found."
            exit 1
          fi

      - name: Update Allure History Branch
        if: always()
        run: |
          if [ ! -d "history-to-save/history" ]; then
            echo "No history to save."
            exit 0
          fi

          echo "Preparing allure-history branch..."

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git worktree add ../allure-history-work origin/allure-history

          rm -rf ../allure-history-work/history
          cp -R history-to-save/history ../allure-history-work/history

          cd ../allure-history-work

          git add history

          if git diff --cached --quiet; then
            echo "No changes to Allure history."
          else
            git commit -m "Update Allure history"
            git push origin HEAD:allure-history
            echo "Allure history updated successfully."
          fi

      - name: Upload Allure Report Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: allure-report/

      - name: Upload Allure Report to Pages
        if: always()
        uses: actions/upload-pages-artifact@v4
        with:
          path: allure-report/


  deploy:

    needs: test

    if: always()

    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:

      - name: Deploy Allure Report to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4